---
layout: default
---

{{ content }}

<h3 class="fw-bold border-bottom pb-3 mb-5" style="font-size: 24px;">Projects</h3>
{% for project in site.data.settings.projects %}
<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h5 style="font-size: 24px;">{{ project.name }}</h5>
    <p>{{ project.title }} | {{ project.department }}</p>
    <p>{{ project.institution }} | {{ project.institution_address }}</p>
    <p><a href="{{ site.github.url }}/people/{{ project.url }}">More info</a></p>
  </div>
  <div class="col-md-6">
    <img src="{{ site.github.url }}/{{ project.image }}" alt="Project profile" width="100%">
  </div>
</div>
{% endfor %}
